<div class="items-center m-auto p-8">
  <button class="px-4 py-2 bg-blue-600 text-white rounded" (click)="openScanner()">Abrir escáner</button>

  <div class="mt-4">
    <h2 class="font-semibold">Códigos escaneados</h2>
    <ul>
      <li *ngFor="let code of scannedCodes()">{{ code }}</li>
    </ul>
  </div>

  <app-barcode-scanner-modal #barcodeScanner (scanned)="onBarcodeScanned($event)" (closed)="onScannerClosed()"></app-barcode-scanner-modal>
</div>
