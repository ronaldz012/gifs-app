<div class="relative flex-1 min-w-0 max-w-[220px]">
  <button
    type="button"
    (click)="isOpen.set(!isOpen())"
    [class.border-accent-ui]="isOpen()"
    [class.bg-bg-surface]="isOpen()"
    class="flex h-[34px] w-full items-center gap-1.5 sm:gap-2 rounded-lg border border-border bg-bg-main px-2 sm:px-3 transition-all hover:border-accent-ui hover:bg-bg-surface"
  >
    <span class="h-1.5 w-1.5 flex-shrink-0 rounded-full bg-feedback-success"></span>
    <span class="flex-1 min-w-0 text-left text-[13px] sm:text-sm font-bold text-text-main truncate">
      {{ active()?.branchName ?? 'Sin sucursal' }}
    </span>
    <svg
      class="flex-shrink-0 text-text-muted transition-transform duration-200"
      [class.rotate-180]="isOpen()"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      class="absolute top-[calc(100%+6px)] right-0 z-50 min-w-[220px] rounded-[10px] border border-border bg-bg-surface p-1 shadow-sm"
    >
      <p class="px-2.5 py-1.5 text-[10px] font-bold uppercase tracking-wider text-text-muted">
        Sucursales
      </p>

      @for (branch of available(); track branch.branchId) {
        <button
          type="button"
          (click)="select(branch)"
          [class.bg-bg-main]="branch.branchId === active()?.branchId"
          [class.text-accent-ui]="branch.branchId === active()?.branchId"
          class="flex w-full items-center gap-2.5 rounded-[7px] px-2.5 py-2 text-left text-sm text-text-main transition-colors hover:bg-bg-main"
        >
          <span
            class="h-1.5 w-1.5 flex-shrink-0 rounded-full"
            [class.bg-feedback-success]="branch.branchId === active()?.branchId"
            [class.bg-border-border]="branch.branchId !== active()?.branchId"
          >
          </span>
          <span class="flex-1 truncate">{{ branch.branchName }}</span>
          @if (branch.branchId === active()?.branchId) {
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-accent-ui"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
