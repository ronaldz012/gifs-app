<!-- topbar.component.html -->
<header class="sticky top-0 z-50 flex h-14 w-full items-center gap-2 border-b border-border bg-bg-surface px-3 md:h-16 md:px-4">

  <!-- Hamburger mobile -->
  <button
    type="button"
    (click)="sidebarSvc.toggle()"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-text-muted transition-colors hover:bg-bg-main focus-visible:outline-none md:hidden">
    <span class="material-icons text-[20px]">
      {{ sidebarSvc.isOpen() ? 'close' : 'menu' }}
    </span>
  </button>

  <div class="flex-1"></div>

  <app-branch-selector />

  <!-- Toggle de tema -->
  <button
    type="button"
    (click)="themeSvc.toggle()"
    title="{{ themeSvc.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro' }}"
    class="flex h-8 w-8 items-center justify-center rounded-lg text-text-muted transition-colors hover:bg-bg-muted hover:text-text-main focus-visible:outline-none">
    <span class="material-icons text-[20px]">
      {{ themeSvc.isDark() ? 'light_mode' : 'dark_mode' }}
    </span>
  </button>

  <app-user-menu />
</header>
