<div class="relative">

  <button
    type="button"
    (click)="isOpen = !isOpen"
    class="flex items-center gap-2 rounded-lg bg-transparent px-2 py-1.5 transition-colors hover:bg-bg-main"
  >
    <div class="flex h-7 w-7 items-center justify-center rounded-full border border-border bg-bg-main text-[11px] font-bold text-text-muted">
      {{ initials }}
    </div>
    <span class="text-sm font-bold text-text-main">{{ currentUser.username }}</span>
    <svg
      class="text-text-muted transition-transform duration-200"
      [class.rotate-180]="isOpen"
      width="12" height="12" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"
    >
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  @if (isOpen) {
    <div class="absolute top-[calc(100%+6px)] right-0 z-50 min-w-[180px] rounded-[10px] border border-border bg-bg-surface p-1 shadow-sm">

      <div class="mb-1 border-b border-border px-2.5 py-2">
        <p class="truncate text-xs font-bold text-text-main">{{ currentUser.username }}</p>
        <p class="truncate text-[11px] text-text-muted">{{ currentUser.email }}</p>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center gap-2.5 rounded-[7px] px-2.5 py-2 text-left text-sm text-feedback-error-text transition-colors hover:bg-feedback-error"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>

    </div>
  }

</div>
