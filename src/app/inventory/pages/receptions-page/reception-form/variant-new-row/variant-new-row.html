<div [formGroup]="form()" class="contents group">

  <div class="px-2 py-1 flex items-center justify-center bg-gray-50/30 border-r border-gray-100">
    <span class="px-1.5 py-0.5 bg-green-100 text-green-700 font-bold text-[8px] rounded border border-green-200 uppercase">
      Nueva
    </span>
  </div>

  <div class="px-1 py-0.5 relative" [formGroup]="newVariantGroup">
    <input
      type="text"
      formControlName="description"
      placeholder="Descripción..."
      class="w-full px-2 py-1 border border-transparent rounded text-[11px] text-gray-900 placeholder-gray-400
             focus:outline-none focus:border-green-400 focus:bg-white focus:ring-1 focus:ring-green-100
             group-hover:border-gray-200 transition-all italic"
    />
  </div>

  <div class="px-1 py-0.5 relative" [formGroup]="newVariantGroup">
    <input
      type="text"
      formControlName="size"
      [placeholder]="newVariantGroup.hasError('duplicateVariant') ? '¡Duplicado!' : 'S/M/L...'"
      class="w-full px-2 py-1 border border-transparent rounded text-[11px] text-gray-900
             focus:outline-none focus:border-green-400 focus:bg-white focus:ring-1 focus:ring-green-100
             group-hover:border-gray-200 transition-all font-medium"
      [class.placeholder-red-500]="newVariantGroup.hasError('duplicateVariant')"
      [class.border-red-300]="newVariantGroup.hasError('duplicateVariant')"
    />
  </div>

  <div class="px-1 py-0.5 flex items-center">
    <app-select-ctrl
      [ctrl]="colorIdCtrl"
      [options]="colors()"
      (createNew)="handleCreateColor($event)"
      class="w-full"
    />
  </div>

  <div class="px-1 py-0.5" [formGroup]="newVariantGroup">
    <input
      type="number"
      formControlName="price"
      placeholder="0"
      class="w-full px-2 py-1 border border-transparent rounded text-[11px] text-gray-900 text-right font-mono
             focus:outline-none focus:border-green-400 focus:bg-white focus:ring-1 focus:ring-green-100
             group-hover:border-gray-200 [appearance:textfield]"
    />
  </div>

  <div class="px-1 py-0.5">
    <input
      type="number"
      formControlName="quantityReceived"
      placeholder="0"
      class="w-full px-2 py-1 border border-transparent rounded text-[11px] text-gray-900 text-right font-bold
             focus:outline-none focus:border-green-400 focus:bg-white focus:ring-1 focus:ring-green-100
             group-hover:border-gray-200 [appearance:textfield]"
    />
  </div>

  <div class="px-1 py-0.5">
    <input
      type="number"
      formControlName="unitCost"
      placeholder="0"
      class="w-full px-2 py-1 border border-transparent rounded text-[11px] text-gray-900 text-right
             focus:outline-none focus:border-green-400 focus:bg-white focus:ring-1 focus:ring-green-100
             group-hover:border-gray-200 [appearance:textfield]"
    />
  </div>

  <div class="px-2 py-1 text-right flex items-center justify-end">
    <span class="text-[11px] font-mono" [class]="subtotal() > 0 ? 'font-bold text-gray-800' : 'text-gray-300'">
      {{ subtotal() > 0 ? (subtotal() | number:'1.0-0') : '0' }}
    </span>
  </div>

  <div class="flex items-center justify-center">
    <button
      type="button"
      tabindex="-1"
      (click)="onRemove()"
      class="text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-full w-6 h-6 flex items-center justify-center transition-all opacity-0 group-hover:opacity-100">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
