<div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow duration-200 group">
  <div class="flex items-start justify-between gap-4">

    <!-- Info Principal -->
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 mb-1">
        <span [ngClass]="{
          'bg-green-100 text-green-700 border-green-200': mode() === 'new',
          'bg-blue-100 text-blue-700 border-blue-200': mode() === 'ex'
        }" class="px-2 py-0.5 text-[10px] font-bold uppercase rounded border tracking-wider">
          {{ mode() === 'new' ? 'Nuevo' : 'Catálogo' }}
        </span>
        <h3 class="text-sm font-semibold text-gray-900 truncate">
          {{ productName() }}
        </h3>
      </div>

      <!-- Listado de Variantes -->
      <div class="flex flex-wrap gap-1.5 mt-3">
        @for (variant of variantsSummary(); track $index) {
          <span class="inline-flex items-center px-2 py-1 bg-gray-50 border border-gray-200 rounded text-[11px] font-medium text-gray-600">
            {{ variant }}
          </span>
        }
      </div>
    </div>

    <!-- Totales -->
    <div class="text-right flex flex-col items-end gap-1">
      <div class="flex flex-col">
        <span class="text-[10px] text-gray-400 uppercase font-bold tracking-tight">Total Unidades</span>
        <span class="text-sm font-bold text-gray-800">{{ totalUnits() }} u.</span>
      </div>
      <div class="flex flex-col mt-1">
        <span class="text-[10px] text-gray-400 uppercase font-bold tracking-tight">Inversión Total</span>
        <span class="text-sm font-bold text-blue-600">Bs {{ totalCost() | number:'1.2-2' }}</span>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex flex-col gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
      <button
        type="button"
        (click)="onEdit()"
        class="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
        title="Editar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>
      <button
        type="button"
        (click)="onRemove()"
        class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
        title="Eliminar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>

  </div>
</div>
