<div class="">

  <!-- ── Header ────────────────────────────────────────────────────────────── -->
  <div class="items-center min-h-10">
    <app-page-header
      [crumbs]="headerCrumbs"
      (crumbClick)="onCrumbClick($event)"
    >
      @if (view() === 'list') {
        <button
          (click)="showCreate()"
          class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium
                 hover:bg-blue-700 transition-colors"
        >
          <span class="hidden sm:inline">Nueva recepción</span>
          <span class="sm:hidden">+ Nueva</span>
        </button>
      }
    </app-page-header>
  </div>

  <!-- ── Views ─────────────────────────────────────────────────────────────── -->
  <div [class]="view() === 'create'
  ? 'w-full px-4 sm:px-6 py-6'
  : 'max-w-5xl mx-auto px-4 sm:px-6 py-6'">
    @switch (view()) {

      @case ('list') {
        <app-reception-list
          [receptions]="receptions()"
          [loading]="loadingReceptions()"
          (viewDetail)="showDetail($event)"
        />
      }

      @case ('detail') {
        @if (selectedReceptionId(); as id) {
          <app-reception-details
            [receptionId]="id"
            (back)="showList()"
            (requestRollback)="openRollbackModal($event)"
          />}
      }
      @case ('create') {
        <app-reception-form
          (saved)="onReceptionSaved()"
          (cancelled)="showList()"
        />
      }

    }
  </div>

</div>

<!-- ── Modal: Rollback ────────────────────────────────────────────────────── -->
@if (rollbackModalId() !== null) {
  <app-confirm-action-modal
    title="¿Revertir recepción?"
    description="Se descontará el stock registrado en esta recepción."
    confirmLabel="Sí, revertir"
    [submitting]="submitting()"
    (confirm)="onRollbackConfirm()"
    (close)="closeRollbackModal()"
  />
}
