<!-- transfer-page.html -->
<div class="bg-gray-50">

  <!-- ── Header (always rendered, crumbs change per view) ─────────────────── -->
  <div class="items-center min-h-10">
  <app-page-header
    [crumbs]="headerCrumbs"
    (crumbClick)="onCrumbClick($event)"
  >
    <!-- Right-side actions depend on active view -->
    @switch (view()) {

      @case ('list') {
        <button
          (click)="showCreate()"
          class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium
                 hover:bg-blue-700 transition-colors"
        >
          <span class="hidden sm:inline">Nueva transferencia</span>
          <span class="sm:hidden">+ Nueva</span>
        </button>
      }

      @case ('detail') {
        @if (selectedTransferId(); as id) {
          <!-- Detail actions are data-driven; TransferDetails exposes canResolve/canCancel
               but the page doesn't have the detail object. We use a helper signal approach:
               TransferDetails emits the actions, the page renders the buttons via the
               detailTransfer signal populated on load. For now the buttons live in the
               header slot only on desktop — mobile buttons are inside TransferDetails. -->
        }
      }

    }
  </app-page-header>
    </div>

  <!-- ── Views ─────────────────────────────────────────────────────────────── -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
    @switch (view()) {

      @case ('list') {
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
          <app-transfer-list
            [transfers]="transfers()"
            [loading]="loadingTransfers()"
            (viewDetail)="showDetail($event)"
            (requestResolve)="openResolveModal($event)"
            (requestCancel)="openCancelModal($event)"
          />
        </div>
      }

      @case ('detail') {
        @if (selectedTransferId(); as id) {
          <app-transfer-details
            [transferId]="id"
            (back)="showList()"
            (requestResolve)="openResolveModal($event)"
            (requestCancel)="openCancelModal($event)"
          />
        }
      }

      @case ('create') {
        <app-create-transfer
          [branches]="branches()"
          [loadingBranches]="loadingBranches()"
          (transferCreated)="onTransferCreated($event)"
          (cancelled)="showList()"
        />
      }

    }
  </div>
</div>

<!-- ── Modals (always at page level, outside view switch) ────────────────── -->
@if (resolveModalId() !== null) {
  <app-resolve-transfer-modal
    [submitting]="submitting()"
    (resolve)="onResolveConfirm($event)"
    (close)="closeResolveModal()"
  />
}

@if (cancelModalId() !== null) {
  <app-cancel-transfer-modal
    [submitting]="submitting()"
    (confirm)="onCancelConfirm()"
    (close)="closeCancelModal()"
  />
}
