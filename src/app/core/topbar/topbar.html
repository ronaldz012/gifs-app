<header class="h-14 w-full flex items-center gap-2 px-3 bg-white border-b border-gray-200 md:h-16 md:px-4">

  <button
    (click)="sidebarSvc.toggle()"
    class="md:hidden flex items-center justify-center w-8 h-8 rounded-lg
           hover:bg-gray-100 transition-colors text-gray-600 flex-shrink-0">
    <span class="material-icons text-[20px]">
      {{ sidebarSvc.isOpen() ? 'close' : 'menu' }}
    </span>
  </button>

  <div class="flex-1"></div>

  <app-branch-selector />
  <app-user-menu />

</header>
