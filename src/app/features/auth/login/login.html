<div class="min-h-screen flex items-center justify-center bg-bg-main p-4">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"
        class="w-full max-w-md bg-bg-surface border border-border rounded-xl shadow-sm p-8 space-y-6">

    <div class="flex items-center gap-3">
      <span class="material-icons text-2xl text-accent-ui">inventory_2</span>
      <h1 class="text-lg font-bold text-text-main">Inventory ERP</h1>
    </div>

    @if (errorMessage()) {
      <div class="flex items-center gap-2 p-3 rounded-lg bg-feedback-error text-feedback-error-text text-sm">
        <span class="material-icons text-[18px]">error</span>
        {{ errorMessage() }}
      </div>
    }

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-text-muted mb-1.5" for="email">Correo electrónico</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          class="w-full px-3 py-2.5 text-sm rounded-lg border border-border bg-bg-muted text-text-main placeholder:text-text-soft outline-none transition-colors focus:border-border-strong"
          placeholder="email@ejemplo.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-text-muted mb-1.5" for="password">Contraseña</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          class="w-full px-3 py-2.5 text-sm rounded-lg border border-border bg-bg-muted text-text-main placeholder:text-text-soft outline-none transition-colors focus:border-border-strong"
          placeholder="••••••••"
        />
      </div>
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid || loading()"
      class="w-full py-2.5 rounded-lg text-sm font-medium bg-btn-primary-bg text-btn-primary-text hover:bg-btn-primary-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
      @if (loading()) {
        <span class="inline-block h-4 w-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
        Iniciando sesión...
      } @else {
        Iniciar sesión
      }
    </button>
  </form>
</div>
