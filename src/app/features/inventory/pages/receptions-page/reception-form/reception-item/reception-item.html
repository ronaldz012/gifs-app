<div class="bg-bg-surface border border-border rounded-xl p-4 shadow-xs hover:shadow-md hover:border-border-strong transition-all duration-200 group relative overflow-hidden">
  <div class="flex items-start justify-between gap-4">

    <!-- Info Principal -->
    <div class="flex-1 min-w-0">
      <h3 class="text-sm font-bold text-text-main truncate tracking-tight group-hover:text-accent-ui transition-colors duration-150">
        {{ group().productName }}
      </h3>
      <span class="text-[11px] text-text-muted font-mono">{{ group().internalCode }}</span>

      <!-- Variantes como pills -->
      <div class="flex flex-wrap gap-1.5 mt-3">
        @for (variant of group().variants; track variant.productVariantId) {
          <span class="inline-flex items-center px-2 py-0.5 bg-bg-muted/50 border border-border rounded text-[11px] font-semibold text-text-muted">
            {{ variant.size }} /  · {{ variant.quantityReceived }} u.
          </span>
        }
      </div>
    </div>

    <!-- Totales -->
    <div class="text-right flex flex-col items-end gap-2 shrink-0">
      <div class="flex flex-col">
        <span class="text-[10px] text-text-soft uppercase font-bold tracking-wider">Total Unidades</span>
        <span class="text-sm font-extrabold text-text-main font-mono">{{ totalUnits() }} u.</span>
      </div>
      <div class="flex flex-col">
        <span class="text-[10px] text-text-soft uppercase font-bold tracking-wider">Inversión Total</span>
        <span class="text-sm font-black text-accent-ui font-mono">Bs {{ totalCost() | number:'1.2-2' }}</span>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-all duration-150 transform translate-x-1 group-hover:translate-x-0">
      <button
        type="button"
        (click)="onRemove()"
        class="p-1.5 text-text-soft hover:text-feedback-error-text hover:bg-feedback-error rounded-lg transition-all duration-150"
        title="Eliminar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>

  </div>
</div>
