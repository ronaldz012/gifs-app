<!-- reception-list-page.html -->

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<div class="border-b border-border bg-bg-surface shadow-sm px-4 sm:px-6 py-4">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
    <h1 class="font-inter text-base font-bold text-text-main">Recepciones</h1>
    <button
      (click)="router.navigate(['inventory','receptions', 'new'])"
      class="px-4 py-2 rounded-lg bg-btn-primary-bg text-btn-primary-text text-sm font-semibold
             hover:bg-btn-primary-hover transition-colors duration-150 whitespace-nowrap shadow-sm">
      <span class="hidden sm:inline">Nueva recepción</span>
      <span class="sm:hidden">+ Nueva</span>
    </button>
  </div>
</div>

<!-- ── Contenido ─────────────────────────────────────────────────────────── -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex flex-col gap-4">

  <!-- Filtros -->
  <app-reception-filter-bar
    [params]="query()"
    (change)="patchQuery($event)" />

  <!-- Lista -->
  <app-reception-list
    [receptions]="receptions()"
    [loading]="loadingReceptions()"
    (goToDetails)="router.navigate(['inventory','receptions', $event])"
    />

  <!-- Estado vacío con filtros activos -->
  @if (!loadingReceptions() && receptions().length === 0 && hasActiveFilters()) {
    <div class="flex flex-col items-center gap-3 p-12 rounded border border-border bg-bg-surface shadow-sm">
      <span class="text-3xl opacity-60">📦</span>
      <p class="font-inter text-sm font-medium text-text-muted">No hay recepciones con esos filtros.</p>
      <button
        class="font-inter text-xs font-bold text-accent-ui transition-colors duration-150 hover:underline"
        (click)="patchQuery({ dateFrom: undefined, dateTo: undefined,
                               status: undefined, brandId: undefined, page: 1 })">
        Limpiar filtros
      </button>
    </div>
  }

  <!-- Paginador -->
  @if (!loadingReceptions() && totalItems() > 0) {
    <app-paginator
      [page]="query().page!"
      [pageSize]="query().pageSize!"
      [totalItems]="totalItems()"
      (pageChange)="patchQuery({ page: $event })"
      (pageSizeChange)="patchQuery({ pageSize: $event, page: 1 })" />
  }

</div>

<!-- ── Modal: Rollback ────────────────────────────────────────────────────── -->
@if (rollbackModalId() !== null) {
  <app-confirm-action-modal
    title="¿Revertir recepción?"
    description="Se descontará el stock registrado en esta recepción."
    confirmLabel="Sí, revertir"
    [submitting]="submitting()"
    (confirm)="onRollbackConfirm()"
    (close)="closeRollbackModal()" />
}
