<div class="flex flex-col gap-4 w-full">
  <!-- Header: título + acciones -->
  <div class="flex items-center justify-between gap-3">
    <h1 class="text-lg font-black text-text-main">Recepciones</h1>
    <div class="flex items-center gap-2 shrink-0">
      <button
        type="button"
        (click)="router.navigate(['inventory', 'products', 'providers'])"
        class="btn btn-secondary btn-sm flex items-center gap-1"
      >
        <span class="material-icons text-base">local_shipping</span>
        Proveedores
      </button>
      <button
        (click)="router.navigate(['inventory', 'receptions', 'new'])"
        class="btn btn-primary btn-sm"
      >
        + Nueva recepción
      </button>
    </div>
  </div>

  <!-- Filtros -->
  <app-reception-filter-bar [params]="query()" (change)="patchQuery($event)" />

  <!-- Lista -->
  <app-reception-list
    [receptions]="receptions()"
    [loading]="loadingReceptions()"
    (goToDetails)="router.navigate(['inventory', 'receptions', $event])"
  />

  <!-- Estado vacío con filtros activos -->
  @if (!loadingReceptions() && receptions().length === 0 && hasActiveFilters()) {
    <div
      class="flex flex-col items-center gap-3 p-12 rounded border border-border bg-bg-surface shadow-sm"
    >
      <span class="text-3xl opacity-60">📦</span>
      <p class="font-inter text-sm font-medium text-text-muted">
        No hay recepciones con esos filtros.
      </p>
      <button
        class="font-inter text-xs font-bold text-accent-ui transition-colors duration-150 hover:underline"
        (click)="
          patchQuery({
            dateFrom: undefined,
            dateTo: undefined,
            status: undefined,
            brandId: undefined,
            page: 1,
          })
        "
      >
        Limpiar filtros
      </button>
    </div>
  }

  <!-- Paginador -->
  @if (!loadingReceptions() && totalItems() > 0) {
    <app-paginator
      [page]="query().page!"
      [pageSize]="query().pageSize!"
      [totalItems]="totalItems()"
      (pageChange)="patchQuery({ page: $event })"
      (pageSizeChange)="patchQuery({ pageSize: $event, page: 1 })"
    />
  }
</div>

<!-- ── Modal: Rollback ────────────────────────────────────────────────────── -->
@if (rollbackModalId() !== null) {
  <app-confirm-action-modal
    title="¿Revertir recepción?"
    description="Se descontará el stock registrado en esta recepción."
    confirmLabel="Sí, revertir"
    [submitting]="submitting()"
    (confirm)="onRollbackConfirm()"
    (close)="closeRollbackModal()"
  />
}
