<!-- reception-list-page.html -->

<!-- ── Header ────────────────────────────────────────────────────────────── -->
<div class="bg-white border-b border-gray-100 shadow-sm px-4 sm:px-6 py-4">
  <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
    <h1 class="text-base font-semibold text-gray-800">Recepciones</h1>
    <button
      (click)="router.navigate(['inventory','receptions', 'new'])"
      class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium
             hover:bg-blue-700 transition-colors whitespace-nowrap">
      <span class="hidden sm:inline">Nueva recepción</span>
      <span class="sm:hidden">+ Nueva</span>
    </button>
  </div>
</div>

<!-- ── Contenido ─────────────────────────────────────────────────────────── -->
<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex flex-col gap-4">

  <!-- Filtros -->
  <app-reception-filter-bar
    [params]="query()"
    (change)="patchQuery($event)" />

  <!-- Lista -->
  <app-reception-list
    [receptions]="receptions()"
    [loading]="loadingReceptions()"
    (goToDetails)="router.navigate(['inventory','receptions', $event])"
    />

  <!-- Estado vacío con filtros activos -->
  @if (!loadingReceptions() && receptions().length === 0 && hasActiveFilters()) {
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-10
                flex flex-col items-center gap-3">
      <span class="text-3xl opacity-30">📦</span>
      <p class="text-sm text-gray-400">No hay recepciones con esos filtros.</p>
      <button
        class="text-sm text-blue-500 hover:underline"
        (click)="patchQuery({ dateFrom: undefined, dateTo: undefined,
                               status: undefined, brandId: undefined, page: 1 })">
        Limpiar filtros
      </button>
    </div>
  }

  <!-- Paginador -->
  @if (!loadingReceptions() && totalItems() > 0) {
    <app-paginator
      [page]="query().page!"
      [pageSize]="query().pageSize!"
      [totalItems]="totalItems()"
      (pageChange)="patchQuery({ page: $event })"
      (pageSizeChange)="patchQuery({ pageSize: $event, page: 1 })" />
  }

</div>

<!-- ── Modal: Rollback ────────────────────────────────────────────────────── -->
@if (rollbackModalId() !== null) {
  <app-confirm-action-modal
    title="¿Revertir recepción?"
    description="Se descontará el stock registrado en esta recepción."
    confirmLabel="Sí, revertir"
    [submitting]="submitting()"
    (confirm)="onRollbackConfirm()"
    (close)="closeRollbackModal()" />
}
