<div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
  <div class="grid grid-cols-1 md:grid-cols-[1fr_360px] gap-6 items-start">
    <!-- Columna izquierda: scanner + lista -->
    <div class="flex flex-col gap-4">
      <div class="bg-bg-surface rounded-xl border border-border shadow-sm p-4">
        <p class="text-xs font-medium text-text-soft uppercase tracking-wide mb-3">
          Agregar producto
        </p>
        <app-product-variant-search
          placeholder="Escanear o ingresar SKU..."
          (productFound)="onProductFound($event)"
        />
      </div>

      <div class="bg-bg-surface rounded-xl border border-border shadow-sm p-4">
        <p class="text-xs font-medium text-text-soft uppercase tracking-wide mb-3">Items</p>
        <app-create-transfer-item-list [items]="items()" (itemsChange)="items.set($event)" />
      </div>
    </div>

    <!-- Columna derecha: configuración -->
    <div class="flex flex-col gap-4">
      <div class="bg-bg-surface rounded-xl border border-border shadow-sm p-4">
        <p class="text-xs font-medium text-text-soft uppercase tracking-wide mb-3">Destino</p>

        <div class="flex items-center gap-3">
          <div class="flex flex-1 min-w-0 items-center gap-2 px-3 py-2 rounded-lg bg-bg-muted">
            <span class="material-icons text-base text-text-muted shrink-0">storefront</span>
            <div class="min-w-0">
              <p class="text-[10px] uppercase tracking-wide text-text-soft">Origen</p>
              <p class="text-sm font-medium text-text-main truncate">{{ originName() }}</p>
            </div>
          </div>

          <span class="material-icons text-text-soft shrink-0">arrow_forward</span>
        </div>

        <div class="mt-3">
          @if (loadingBranches()) {
            <p class="text-sm text-text-muted">Cargando sucursales...</p>
          } @else {
            <app-branch-selector-destination
              [branches]="branches()"
              (branchSelected)="onBranchSelected($event)"
            />
          }
        </div>
      </div>

      <div class="bg-bg-surface rounded-xl border border-border shadow-sm p-4">
        <p class="text-xs font-medium text-text-soft uppercase tracking-wide mb-3">Notas</p>
        <textarea
          [value]="form().notes"
          (input)="patchNotes($any($event.target).value)"
          rows="3"
          placeholder="Ej: urgente, para reposición..."
          class="w-full px-3 py-2.5 text-sm rounded-lg border border-border focus:outline-none focus:ring-2 focus:ring-accent-ui/20 focus:border-accent-ui resize-none placeholder:text-text-soft bg-bg-surface text-text-main"
        ></textarea>
      </div>

      @if (items().length > 0) {
        <div
          class="bg-feedback-info text-feedback-info-text rounded-xl border border-feedback-info-text/20 p-4 flex justify-between text-sm"
        >
          <span> {{ items().length }} {{ items().length === 1 ? 'producto' : 'productos' }} </span>
          <span class="font-medium">{{ totalUnits() }} unidades</span>
        </div>
      }

      <div class="flex gap-3">
        <button (click)="cancel()" class="btn btn-secondary flex-1 py-3">Cancelar</button>
        <button
          (click)="submit()"
          [disabled]="!canSubmit()"
          class="btn btn-primary flex-1 py-3 disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Crear transferencia
        </button>
      </div>
    </div>
  </div>
</div>
