<!-- transfer-list-page.html -->

<!-- ── Contenido ─────────────────────────────────────────────────────────── -->
<div class="px-2 sm:px-6 py-4 sm:py-6 flex flex-col gap-4">

  <!-- Filtros + Botón Crear -->
  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
    <app-transfer-filter-bar
      class="flex-1 min-w-0"
      [params]="query()"
      (change)="patchQuery($event)" />

    <app-navigate-button
      label="Nueva transferencia"
      shortLabel="+ Nueva"
      [route]="['inventory','transfers','new']" />
  </div>

  <!-- Lista -->
  <app-transfer-list
    [transfers]="transfers()"
    [loading]="loadingTransfers()"
    (viewDetail)="router.navigate(['inventory','transfers', $event])"
    (requestResolve)="openResolveModal($event)"
    (requestCancel)="openCancelModal($event)" />

  <!-- Estado vacío con filtros activos -->
  @if (!loadingTransfers() && transfers().length === 0 && hasActiveFilters()) {
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-10
                flex flex-col items-center gap-3">
      <span class="text-3xl opacity-30">🔄</span>
      <p class="text-sm text-gray-400">No hay transferencias con esos filtros.</p>
      <button
        class="text-sm text-blue-500 hover:underline"
        (click)="patchQuery({ status: undefined, direction: undefined,
                               dateFrom: undefined, dateTo: undefined, page: 1 })">
        Limpiar filtros
      </button>
    </div>
  }

  <!-- Paginador -->
  @if (!loadingTransfers() && totalItems() > 0) {
    <app-paginator
      [page]="query().page!"
      [pageSize]="query().pageSize!"
      [totalItems]="totalItems()"
      (pageChange)="patchQuery({ page: $event })"
      (pageSizeChange)="patchQuery({ pageSize: $event, page: 1 })" />
  }

</div>

<!-- ── Modales ────────────────────────────────────────────────────────────── -->
@if (resolveModalId() !== null) {
  <app-resolve-transfer-modal
    [submitting]="submitting()"
    (resolve)="onResolveConfirm($event)"
    (close)="closeResolveModal()" />
}

@if (cancelModalId() !== null) {
  <app-confirm-action-modal
    title="¿Cancelar Transferencia?"
    description="Esta acción cancelará la transferencia seleccionada"
    confirmLabel="Sí, Cancelar"
    [submitting]="submitting()"
    (confirm)="onCancelConfirm()"
    (close)="closeCancelModal()" />
}
