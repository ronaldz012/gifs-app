<div [formGroup]="form()" class="contents group">

  <div class="border-r border-gray-100 flex flex-col justify-center bg-gray-50/30">
    <div class="flex flex-col items-center gap-0.5">
      <span class="text-[8px] text-gray-400 font-bold uppercase">Origen</span>
      <span class="px-1.5 py-0.5 bg-green-100 text-green-700 font-bold text-[8px] rounded border border-green-200">
        NUEVO
      </span>
    </div>
  </div>

  <div class="px-2 py-1 flex flex-col border-r border-gray-100">
    <label class="text-[9px] text-green-700 font-bold uppercase">
      Producto
    </label>
    <div class="mt-0.5">
      <input
        type="text"
        formControlName="name"
        placeholder="Nombre del modelo..."
        class="w-full px-1.5 py-0.5 border border-gray-200 rounded text-[12px] text-gray-900 placeholder-gray-300
               focus:outline-none focus:border-green-400 focus:ring-1 focus:ring-green-400
               transition-all bg-white font-medium"
      />
    </div>
  </div>

  <div class="px-2 py-1 flex flex-col border-r border-gray-100">
    <label class="text-[9px] text-gray-400 font-bold uppercase">Categoría</label>
    <div class="mt-0.5">
      <app-select-from-list
        formControlName="categoryId"
        [options]="categories()"
        (createNew)="handleCreateCategory($event)"
      />
    </div>
  </div>

  <div class="px-2 py-1 flex flex-col border-r border-gray-100">
    <label class="text-[9px] text-gray-400 font-bold uppercase">Marca</label>
    <div class="mt-0.5">
      <app-select-from-list
        formControlName="brandId"
        [options]="brands()"
        (createNew)="handleCreateBrand($event)"
      />
    </div>
  </div>

  <div class="px-2 py-1 flex flex-col border-r border-gray-100">
    <span class="text-[9px] text-gray-400 font-bold uppercase">Género</span>
    <div class="mt-0.5">
      <select
        formControlName="gender"
        class="w-full px-1.5 py-0.5 border border-gray-200 rounded text-[11px] font-bold bg-white text-gray-700
               focus:outline-none focus:border-green-400 focus:ring-1 focus:ring-green-400
               transition-all cursor-pointer"
      >
        @for (opt of genderOptions; track opt.value) {
          <option [ngValue]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="px-2 py-1 flex flex-col items-end border-r border-gray-100 bg-green-50/30">
    <label class="text-[9px] text-green-600 font-bold uppercase leading-none text-right">
      Precio Base <br> <span class="text-[7px] lowercase font-normal opacity-70">(Sugerido)</span>
    </label>
    <div class="flex items-center gap-1 mt-auto pb-1">
      <span class="text-[10px] font-bold text-green-800">Bs</span>
      <input
        type="number"
        formControlName="basePrice"
        class="w-16 bg-transparent border-none p-0 text-[12px] font-extrabold text-green-800 text-right
               focus:ring-0 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
      />
    </div>
  </div>

  <div class="px-2 py-1 flex flex-col border-r border-gray-100 col-span-2">
    <span class="text-[9px] text-gray-400 font-bold uppercase">
      Descripción <span class="text-[8px] font-normal lowercase">(Opcional)</span>
    </span>
    <input
      type="text"
      formControlName="description"
      placeholder="Añadir nota..."
      class="w-full bg-transparent border-none p-0 text-[10px] text-gray-500 italic focus:ring-0 mt-auto pb-1"
    />
  </div>

  <div class="flex items-center justify-center bg-gray-50/50 border-l border-gray-100">
    <button
      type="button"
      tabindex="-1"
      (click)="remove.emit()"
      class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-all"
    >
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

</div>
