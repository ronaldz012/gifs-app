<div class="bg-bg-surface border border-border rounded-lg shadow-lg p-4 w-72">

  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <h3 class="section-title mb-0">Nueva Marca</h3>
    <button (click)="closed.emit()" class="btn-icon hover:text-text-main">
      <span class="material-icons text-base">close</span>
    </button>
  </div>

  <!-- Error servidor -->
  @if (serverError()) {
    <div class="badge-error w-full text-center mb-3 rounded-lg px-3 py-2 text-xs">
      {{ serverError() }}
    </div>
  }

  <div class="space-y-3">

    <!-- Nombre -->
    <div>
      <label for="name" class="field-label block">NOMBRE</label>
      <input
        #nameInput
        id="name"
        type="text"
        [formField]="brandForm.name"
        (input)="clearServerError()"
        placeholder="Ej. Nike"
        autocomplete="off"
        class="w-full px-3 py-2 rounded-lg border bg-bg-muted text-text-main text-sm
               outline-none transition-all focus:ring-2 focus:ring-[--focus-ring]
               focus:border-accent-ui placeholder:text-text-soft"
        [class.border-feedback-error-text]="nameInvalid"
        [class.border-border]="!nameInvalid"
      />
      @if (nameInvalid) {
        <p class="text-[10px] text-feedback-error-text mt-1">{{ nameError }}</p>
      }
    </div>

    <!-- Prefijo -->
    <div>
      <label for="prefix" class="field-label block">PREFIJO (3 LETRAS)</label>
      <div class="relative">
        <input
          id="prefix"
          type="text"
          [formField]="brandForm.prefix"
          (input)="onPrefixInput($event)"
          placeholder="NIK"
          autocomplete="off"
          class="w-full px-3 py-2 rounded-lg border bg-bg-muted text-text-main text-sm
                 uppercase font-mono tracking-widest outline-none transition-all
                 focus:ring-2 focus:ring-[--focus-ring] focus:border-accent-ui
                 placeholder:text-text-soft placeholder:normal-case placeholder:tracking-normal"
          [class.border-feedback-error-text]="prefixInvalid"
          [class.border-border]="!prefixInvalid"
        />
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-text-soft">
          {{ prefixState.value().length }}/3
        </span>
      </div>
      @if (prefixInvalid) {
        <p class="text-[10px] text-feedback-error-text mt-1">{{ prefixError }}</p>
      }
    </div>

    <!-- Descripción (opcional) -->
    <div>
      <label for="description" class="field-label block">
        DESCRIPCIÓN <span class="text-text-soft normal-case font-normal">(opcional)</span>
      </label>
      <textarea
        id="description"
        [formField]="brandForm.description"
        placeholder="Descripción breve..."
        rows="2"
        class="w-full px-3 py-2 rounded-lg border border-border bg-bg-muted text-text-main
               text-sm outline-none transition-all resize-none
               focus:ring-2 focus:ring-[--focus-ring] focus:border-accent-ui
               placeholder:text-text-soft"
      ></textarea>
    </div>

    <!-- Acciones -->
    <div class="flex gap-2 pt-1">
      <button
        type="button"
        (click)="closed.emit()"
        [disabled]="isLoading()"
        class="btn btn-secondary btn-sm flex-1">
        Cancelar
      </button>
      <button
        type="button"
        (click)="save()"
        [disabled]="isLoading() || brandForm().invalid()"
        class="btn btn-primary btn-sm flex-1">
        {{ isLoading() ? 'Guardando...' : 'CREAR' }}
      </button>
    </div>

  </div>
</div>
