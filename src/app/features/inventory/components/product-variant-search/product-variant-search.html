<div class="flex flex-col gap-1">
  <div class="relative">
    <input
      #searchInput
      type="text"
      [placeholder]="placeholder()"
      [(ngModel)]="code"
      (keydown.enter)="onEnter()"
      [disabled]="loading()"
      autocomplete="off"
      inputmode="text"
      class="w-full px-3 py-2.5 text-base rounded-lg border border-border bg-bg-surface text-text-main focus:outline-none focus:ring-2 focus:ring-accent-ui/20 focus:border-accent-ui disabled:opacity-50 disabled:cursor-not-allowed placeholder:text-text-soft"
    />

    @if (loading()) {
      <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-text-soft">
        Buscando...
      </span>
    }
  </div>

  @if (errorMsg()) {
    <p class="text-xs text-feedback-error-text px-1">{{ errorMsg() }}</p>
  }
</div>
