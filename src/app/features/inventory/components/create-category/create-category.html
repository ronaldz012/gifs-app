<div class="bg-bg-surface border border-border rounded-lg shadow-lg p-4 w-64">

  <!-- Header -->
  <div class="flex justify-between items-center mb-3">
    <p class="section-title mb-0">Nueva Categoría</p>
    <button (click)="closed.emit()" class="btn-icon hover:text-text-main">
      <span class="material-icons text-base">close</span>
    </button>
  </div>

  <!-- Error servidor -->
  @if (serverError()) {
    <div class="badge-error w-full text-center mb-3 rounded-lg px-3 py-2 text-xs">
      {{ serverError() }}
    </div>
  }

  <div class="space-y-3">

    <!-- Nombre -->
    <div>
      <label for="name" class="field-label block">NOMBRE</label>
      <input
        #nameInput
        id="name"
        type="text"
        [formField]="categoryForm.name"
        (input)="clearServerError()"
        placeholder="Ej. Electrónica"
        autocomplete="off"
        class="w-full px-3 py-2 rounded-lg border bg-bg-muted text-text-main text-sm
               outline-none transition-all focus:ring-2 focus:ring-[--focus-ring]
               focus:border-accent-ui placeholder:text-text-soft"
        [class.border-feedback-error-text]="nameInvalid"
        [class.border-border]="!nameInvalid"
      />
      @if (nameInvalid) {
        <p class="text-[10px] text-feedback-error-text mt-1">{{ nameError }}</p>
      }
    </div>

    <!-- Descripción -->
    <div>
      <label for="description" class="field-label block">
        DESCRIPCIÓN <span class="text-text-soft normal-case font-normal">(opcional)</span>
      </label>
      <input
        id="description"
        type="text"
        [formField]="categoryForm.description"
        placeholder="Descripción breve..."
        autocomplete="off"
        class="w-full px-3 py-2 rounded-lg border border-border bg-bg-muted text-text-main
               text-sm outline-none transition-all focus:ring-2 focus:ring-[--focus-ring]
               focus:border-accent-ui placeholder:text-text-soft"
      />
    </div>

    <!-- Acciones -->
    <div class="flex gap-2 pt-1">
      <button
        type="button"
        (click)="save()"
        [disabled]="isLoading() || categoryForm().invalid()"
        class="btn btn-primary btn-sm flex-1">
        {{ isLoading() ? 'Guardando...' : 'CREAR' }}
      </button>
      <button
        type="button"
        (click)="closed.emit()"
        [disabled]="isLoading()"
        class="btn btn-secondary btn-sm flex-1">
        Cancelar
      </button>
    </div>

  </div>
</div>
