@if (isOpen()) {
  <!-- Overlay -->
  <div
    class="fixed inset-0 z-50 flex items-end justify-center sm:items-center"
    role="dialog"
    aria-modal="true"
    aria-label="Escáner de código QR"
  >
    <!-- Backdrop -->
    <div
      class="absolute inset-0 bg-overlay"
      (click)="close()"
    ></div>

    <!-- Panel -->
    <div
      class="modal-enter relative z-10 w-full max-w-sm mx-auto
             bg-bg-surface rounded-t-2xl sm:rounded-2xl
             shadow-lg overflow-hidden
             flex flex-col"
    >
      <!-- Handle (mobile only) -->
      <div class="sm:hidden w-10 h-1 rounded-full bg-bg-muted mx-auto mt-3 mb-1"></div>

      <!-- Header -->
      <div class="flex items-center justify-between px-4 pt-4 pb-3 border-b border-border">
        <div class="flex items-center gap-2">
          <span class="material-icons text-accent-ui text-[20px]">qr_code_scanner</span>
          <span class="text-sm font-semibold text-text-main font-sora">Escanear etiqueta</span>
        </div>
        <button
          type="button"
          class="btn-icon hover:bg-bg-muted"
          (click)="close()"
          aria-label="Cerrar escáner"
        >
          <span class="material-icons text-[18px]">close</span>
        </button>
      </div>

      <!-- Cuerpo -->
      <div class="flex flex-col gap-4 p-4">

        <!-- Estado: inicializando -->
        @if (isInitializing()) {
          <div class="flex flex-col items-center justify-center gap-3 py-12 text-text-soft">
            <span class="material-icons animate-spin text-[32px] text-accent-ui">sync</span>
            <p class="text-sm">Iniciando cámara…</p>
          </div>
        }

        <!-- Estado: error -->
        @if (errorMsg()) {
          <div class="flex flex-col items-center gap-3 py-10">
            <span class="material-icons text-feedback-error-text text-[36px]">no_photography</span>
            <p class="text-sm text-feedback-error-text text-center">{{ errorMsg() }}</p>
            <button type="button" class="btn-secondary btn-sm" (click)="close()">
              Cerrar
            </button>
          </div>
        }

        <!-- Viewfinder de video -->
        @if (!isInitializing() && !errorMsg()) {
          <!-- MEJORA: aspect-square en móvil, aspect-video en pantallas más grandes -->
          <div class="relative w-full aspect-square sm:aspect-video rounded-xl overflow-hidden bg-black">
            <video
              #videoEl
              autoplay
              playsinline
              muted
              class="w-full h-full object-cover"
            ></video>

            <!-- Marco guía — responsivo y optimizado para encuadre cómodo -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
              <!-- MEJORA: w-3/5 para que tome un buen tamaño, max-w para que no crezca de más -->
              <div
                class="relative w-3/5 aspect-square max-w-[240px] rounded-lg
                       border border-white/40
                       shadow-[0_0_0_9999px_rgba(0,0,0,0.55)]"
              >
                <!-- Esquinas decorativas MEJORADAS: bordes más gruesos (border-4) -->
                <span class="absolute -top-[1px] -left-[1px]  w-6 h-6 border-t-4 border-l-4 border-[var(--raw-success)] rounded-tl-md"></span>
                <span class="absolute -top-[1px] -right-[1px] w-6 h-6 border-t-4 border-r-4 border-[var(--raw-success)] rounded-tr-md"></span>
                <span class="absolute -bottom-[1px] -left-[1px]  w-6 h-6 border-b-4 border-l-4 border-[var(--raw-success)] rounded-bl-md"></span>
                <span class="absolute -bottom-[1px] -right-[1px] w-6 h-6 border-b-4 border-r-4 border-[var(--raw-success)] rounded-br-md"></span>
              </div>
            </div>
          </div>

          <p class="text-xs text-text-soft text-center px-4">
            Apuntá el código QR de la etiqueta dentro del recuadro
          </p>
        }

      </div>

      <!-- Footer -->
      <div class="px-4 pb-5 pt-1">
        <button
          type="button"
          class="btn btn-secondary w-full"
          (click)="close()"
        >
          Cancelar
        </button>
      </div>
    </div>
  </div>
}
