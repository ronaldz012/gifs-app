<div
  class="fixed inset-0 bg-black/40 z-50 flex items-end justify-center backdrop-blur-sm"
  (click)="close.emit()"
>
  <div
    class="confirm-enter w-full max-w-md bg-white rounded-t-3xl shadow-2xl overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <div class="w-12 h-1.5 rounded-full bg-gray-200 mx-auto mt-3 mb-4"></div>

    <div class="px-6 pb-8">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="text-lg font-bold text-gray-800 leading-tight">Escanear Producto</h3>
          <p class="text-xs text-gray-400">Código de barras o QR</p>
        </div>
        <button
          (click)="close.emit()"
          class="p-2 bg-gray-50 rounded-full text-gray-400 hover:text-gray-600 transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- Preview de cámara -->
      <div class="relative w-full bg-black rounded-2xl overflow-hidden mb-4 border-4 border-gray-50 shadow-inner"
           style="aspect-ratio: 4/3;">
        <zxing-scanner
          [formats]="allowedFormats"
          [videoConstraints]="videoConstraints"
          (camerasFound)="onCamerasFound($event)"
          (scanSuccess)="onCodeDetected($event)"
          [previewFitMode]="'cover'"
          class="w-full h-full"
        ></zxing-scanner>
        <!-- Feedback escaneo exitoso -->
        @if (lastScannedCode()) {
          <div class="absolute inset-0 bg-emerald-500/20 backdrop-blur-[1px] flex items-center justify-center">
            <div class="bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-bold shadow-lg flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                   fill="none" stroke="white" stroke-width="3"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17l-5-5"/>
              </svg>
              {{ lastScannedCode() }}
            </div>
          </div>
        }

        <!-- Debug bar — eliminá esta línea en producción -->
        <div class="absolute bottom-0 left-0 right-0 bg-black/60 text-white text-[9px] px-2 py-0.5 font-mono">
          {{ debugInfo() }}
        </div>
      </div>

      <div class="text-center">
        <p class="text-[10px] text-gray-300 font-medium tracking-widest uppercase">
          DriveCore POS • Scanner Engine
        </p>
      </div>
    </div>
  </div>
</div>
