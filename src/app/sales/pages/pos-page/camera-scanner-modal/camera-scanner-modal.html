<div
  class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center backdrop-blur-sm"
  (click)="close.emit()"
>
  <div
    class="confirm-enter w-full max-w-md bg-white rounded-t-[2.5rem] shadow-2xl overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <!-- Barra de arrastre -->
    <div class="w-12 h-1.5 rounded-full bg-gray-200 mx-auto mt-4 mb-2"></div>

    <div class="px-6 pb-10">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h3 class="text-xl font-extrabold text-gray-900 tracking-tight">Escanear</h3>
          <p class="text-sm text-gray-500 font-medium">Encuadra el código QR</p>
        </div>
        <button
          (click)="close.emit()"
          class="p-2.5 bg-gray-100 rounded-full text-gray-500 active:scale-95 transition-all"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>

      <!-- Contenedor de Cámara -->
      <div class="relative w-full aspect-square bg-black rounded-3xl overflow-hidden shadow-2xl ring-4 ring-gray-50">

        <zxing-scanner
          [formats]="allowedFormats"
          [videoConstraints]="videoConstraints"
          [tryHarder]="true"
          (camerasFound)="onCamerasFound($event)"
          (scanSuccess)="onCodeDetected($event)"
          (scanError)="onScanError($event)"
          (scanFailure)="onScanFailure($event)"
          [previewFitMode]="'cover'"
          class="w-full h-full"
        ></zxing-scanner>

        <!-- Overlay de Visor (Mejora la UX y precisión) -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
          <!-- Esquinas del visor -->
          <div class="w-64 h-64 border-2 border-white/30 rounded-3xl relative">
            <div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-emerald-500 rounded-tl-lg"></div>
            <div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-emerald-500 rounded-tr-lg"></div>
            <div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-emerald-500 rounded-bl-lg"></div>
            <div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-emerald-500 rounded-br-lg"></div>

            <!-- Línea de escaneo animada -->
            <div class="scan-line absolute left-4 right-4 h-0.5 bg-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.8)]"></div>
          </div>
        </div>

        <!-- Feedback escaneo exitoso -->
        @if (lastScannedCode()) {
          <div class="absolute inset-0 bg-emerald-600/40 backdrop-blur-sm flex items-center justify-center animate-in fade-in duration-200">
            <div class="bg-white px-6 py-3 rounded-2xl shadow-xl flex flex-col items-center gap-2 scale-110">
              <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="text-emerald-600" width="24" height="24" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 6L9 17l-5-5"/>
                </svg>
              </div>
              <span class="text-xs font-black text-gray-800 tracking-wider uppercase">{{ lastScannedCode() }}</span>
            </div>
          </div>
        }

        <!-- Debug Info -->
        <div class="absolute bottom-4 left-4 right-4 bg-black/40 backdrop-blur-md text-white text-[10px] px-3 py-1.5 rounded-full font-mono text-center">
          {{ debugInfo() }}
        </div>
      </div>

      <div class="mt-6 text-center">
        <p class="text-[10px] text-gray-400 font-bold tracking-[0.2em] uppercase">
          Scanner Engine v2.0 • Ultra-Fast Mode
        </p>
      </div>
    </div>
  </div>
</div>
